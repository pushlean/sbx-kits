name: Publish kits

on:
  push:
    branches: [main]
    paths:
      - "kits/**"
      - ".github/workflows/publish-kits.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  SBX_VERSION: v0.43.0
  SBX_LINUX_AMD64_SHA256: 3eb15b8444e969aaa8d637250bef0f2bf90cb030aba0a7016a56b8e5fcdd25fe

jobs:
  discover:
    name: Discover kits to publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kits: ${{ steps.kits.outputs.kits }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Collect kits
        id: kits
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          discover_all() {
            find kits -mindepth 2 -maxdepth 2 -type f \
              \( -name spec.yaml -o -name spec.yml \) \
              -printf '%h\n' |
              sed 's#^kits/##' |
              sort -u
          }

          publish_all=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            publish_all=true
          else
            before="$BEFORE_SHA"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              publish_all=true
            elif git diff --name-only "$before" "$GITHUB_SHA" |
              grep -Fxq '.github/workflows/publish-kits.yml'; then
              publish_all=true
            fi
          fi

          if [ "$publish_all" = true ]; then
            kits=$(discover_all)
          else
            before="$BEFORE_SHA"
            kits=$(git diff --name-only "$before" "$GITHUB_SHA" |
              awk -F/ '$1 == "kits" && NF >= 3 { print $2 }' |
              sort -u |
              while IFS= read -r kit; do
                if [ -f "kits/$kit/spec.yaml" ] || [ -f "kits/$kit/spec.yml" ]; then
                  printf '%s\n' "$kit"
                fi
              done)
          fi

          while IFS= read -r kit; do
            [ -z "$kit" ] || [[ "$kit" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || {
              echo "::error::Kit directory '$kit' is not a valid lowercase OCI repository component"
              exit 1
            }
          done <<< "$kits"

          kits_json=$(printf '%s\n' "$kits" |
            jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "Publishing kits: $kits_json"
          echo "kits=$kits_json" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.kit }}
    needs: discover
    if: needs.discover.outputs.kits != '[]'
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kit: ${{ fromJson(needs.discover.outputs.kits) }}
    concurrency:
      group: publish-kit-${{ matrix.kit }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install sbx
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/DockerSandboxes-linux-amd64.tar.gz"
          curl -fsSL \
            "https://github.com/docker/sbx-releases/releases/download/${SBX_VERSION}/DockerSandboxes-linux-amd64.tar.gz" \
            -o "$archive"
          echo "${SBX_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sudo env PREFIX="$RUNNER_TEMP/sbx" "$RUNNER_TEMP/docker-sbx/install.sh"
          echo "$RUNNER_TEMP/sbx/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: "1.3.3"

      - name: Validate kit
        env:
          KIT: ${{ matrix.kit }}
        run: sbx kit validate "kits/$KIT"

      - name: Publish kit
        id: publish
        shell: bash
        env:
          KIT: ${{ matrix.kit }}
        run: |
          set -euo pipefail

          kit="$KIT"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ref="ghcr.io/${owner}/${kit}-kit"
          tag="sha-${GITHUB_SHA}"
          error_log=$(mktemp)
          trap 'rm -f "$error_log"' EXIT

          echo "Checking ${ref}:${tag}"
          if descriptor=$(oras manifest fetch --descriptor "${ref}:${tag}" 2>"$error_log"); then
            digest=$(jq -r .digest <<< "$descriptor")
            echo "Immutable tag already exists; reusing ${digest}"
          elif grep -qiE 'not found|manifest unknown|name unknown|404' "$error_log"; then
            echo "Publishing signed kit artifact"
            sbx kit push "kits/${kit}" "${ref}:${tag}" --sign
            digest=$(oras manifest fetch --descriptor "${ref}:${tag}" | jq -r .digest)
          else
            echo "::error::Could not determine whether ${ref}:${tag} exists"
            cat "$error_log"
            exit 1
          fi

          if [ -z "$digest" ] || [ "$digest" = null ]; then
            echo "::error::Could not resolve the published manifest digest"
            exit 1
          fi

          echo "Pointing ${ref}:latest at ${digest}"
          oras tag "${ref}@${digest}" latest

          echo "reference=${ref}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Summarize
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMMUTABLE_TAG: sha-${{ github.sha }}
          KIT: ${{ matrix.kit }}
          REFERENCE: ${{ steps.publish.outputs.reference }}
        run: |
          {
            echo "## $KIT"
            echo
            echo "Published and signed:"
            echo
            echo "- \`${REFERENCE}:${IMMUTABLE_TAG}\`"
            echo "- \`${REFERENCE}:latest\`"
            echo "- \`${REFERENCE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
