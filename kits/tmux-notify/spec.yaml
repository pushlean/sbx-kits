schemaVersion: "2"
kind: mixin
name: tmux-notify
displayName: tmux Desktop Notifications
description: |
  Forward Claude Code Notification events to the host desktop over the terminal
  stream — no host-side watcher required. Installs ~/.claude/notify-host, which
  emits an OSC 777 escape sequence wrapped in a tmux passthrough envelope, and
  registers a Notification hook that runs `notify-host --hook`. The host's tmux
  (or terminal) raises the desktop notification.

  Assumes the host runs tmux with `set -g allow-passthrough on` — notify-host
  always emits the passthrough envelope.

  Add this kit AFTER the sandbox is created, because `claude` clobbers
  ~/.claude/settings.json when it first initializes:
    sbx kit add <sandbox> kits/tmux-notify/

setup:
  install:
    # notify-host itself ships as files/home/.claude/notify-host and is copied in
    # by the engine with its on-disk mode preserved — no install step needed. That
    # copy runs *after* install commands, hence the mkdir below.
    - description: Register the Notification hook in ~/.claude/settings.json
      user: "1000"
      command: |
        set -eu
        mkdir -p /home/agent/.claude
        cd /home/agent/.claude
        existing=$(test -f settings.json && cat settings.json || echo '{}')
        cmd='/home/agent/.claude/notify-host --hook'
        printf '%s' "$existing" | jq --arg cmd "$cmd" '
          .hooks //= {} |
          .hooks.Notification //= [] |
          if any(.hooks.Notification[]?.hooks[]?; .command == $cmd) then .
          else .hooks.Notification += [{hooks: [{type: "command", command: $cmd, timeout: 5}]}]
          end
        ' > settings.json.tmp
        mv settings.json.tmp settings.json
