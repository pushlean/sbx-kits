schemaVersion: "2"
kind: mixin
name: tmux-notify
displayName: tmux Desktop Notifications
description: |
  Forward Claude Code Notification events to the host desktop over the terminal
  stream — no host-side watcher required. Installs ~/.claude/notify-host, which
  emits an OSC 777 escape sequence wrapped in a tmux passthrough envelope, and
  registers Notification and PreToolUse/ExitPlanMode hooks that run
  `notify-host --hook`. The host's tmux (or terminal) raises the desktop
  notification. The second hook covers plan mode, whose approval prompt the
  Notification event delivers late or not at all.

  Each notification is titled with the sandbox name and the current git branch
  (e.g. `claude-sbx-kits [main]`), so concurrent sandboxes are distinguishable.

  Assumes the host runs tmux with `set -g allow-passthrough on` — notify-host
  always emits the passthrough envelope.

  Add this kit AFTER the sandbox is created, because `claude` clobbers
  ~/.claude/settings.json when it first initializes:
    sbx kit add <sandbox> kits/tmux-notify/

setup:
  install:
    # notify-host itself ships as files/home/.claude/notify-host and is copied in
    # by the engine with its on-disk mode preserved — no install step needed. That
    # copy runs *after* install commands, hence the mkdir below.
    - description: Register the notification hooks in ~/.claude/settings.json
      user: "1000"
      command: |
        set -eu
        mkdir -p /home/agent/.claude
        cd /home/agent/.claude
        existing=$(test -f settings.json && cat settings.json || echo '{}')
        cmd='/home/agent/.claude/notify-host --hook'
        # Two events, because Notification alone misses plan approval in practice:
        # Claude Code emits the plan dialog's Notification from a 6s poller that
        # is skipped while you are interacting, so it can lag badly or never land.
        # PreToolUse on ExitPlanMode fires the moment the plan is submitted.
        printf '%s' "$existing" | jq --arg cmd "$cmd" '
          def entry: {hooks: [{type: "command", command: $cmd, timeout: 5}]};
          .hooks //= {} |
          .hooks.Notification //= [] |
          .hooks.PreToolUse //= [] |
          (if any(.hooks.Notification[]?.hooks[]?; .command == $cmd) then .
           else .hooks.Notification += [entry] end) |
          (if any(.hooks.PreToolUse[]?; .matcher == "ExitPlanMode"
                  and any(.hooks[]?; .command == $cmd)) then .
           else .hooks.PreToolUse += [entry + {matcher: "ExitPlanMode"}] end)
        ' > settings.json.tmp
        mv settings.json.tmp settings.json
