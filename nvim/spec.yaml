schemaVersion: "1"
kind: mixin
name: nvim
displayName: Neovim
description: |
  Install Neovim and a barebones init.lua that sources ~/.vimrc-keys (a
  mirror of the host keymap). Also exports EDITOR=nvim so $EDITOR-driven
  prompts (e.g. Claude Code's external editor) open in nvim.

environment:
  variables:
    EDITOR: nvim

commands:
  install:
    - command: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends neovim
      user: "0"
      description: Install Neovim via apt
    - command: |
        set -euo pipefail
        mkdir -p ~/.config/nvim
        cat > ~/.config/nvim/init.lua <<'EOF'
        vim.cmd 'source ~/.vimrc-keys'

        -- Save and exit with Ctrl+s
        vim.api.nvim_set_keymap("i", "<C-s>", "<esc>:wq!<cr>", { noremap = true })
        vim.api.nvim_set_keymap("n", "<C-s>", ":wq!<cr>", { noremap = true })
        EOF
        cat > ~/.vimrc-keys <<'EOF'
        " Swap colon with semi-colon
        nnoremap ; :
        nnoremap : ;
        vnoremap ; :
        vnoremap : ;

        " Ctrl-j/k deletes blank line below/above, and Alt-j/k inserts.
        " nnoremap <silent><C-j> m`:silent +g/\m^\s*$/d<CR>``:noh<CR>
        " nnoremap <silent><C-k> m`:silent -g/\m^\s*$/d<CR>``:noh<CR>
        nnoremap <silent><A-j> :set paste<CR>m`o<Esc>``:set nopaste<CR>
        nnoremap <silent><A-k> :set paste<CR>m`O<Esc>``:set nopaste<CR>

        " Copy and paste to system clipboard
        vmap <C-c> "+y
        vmap <C-x> "+c
        vmap <C-v> c<ESC>"+p
        imap <C-v> <ESC>"+pa

        " delete without yanking
        "nnoremap d "_d
        "vnoremap d "_d

        " replace currently selected text with default register
        " without yanking it
        "vnoremap p "_dP
        EOF
      user: "1000"
      description: Write Neovim config and keymap files
